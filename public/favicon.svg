<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Vibrant Emerald-Cyan Teal Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d592" />
      <stop offset="50%" stop-color="#00b87c" />
      <stop offset="100%" stop-color="#009e6b" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#005e3f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Squircle Icon Body -->
  <rect x="8" y="12" width="108" height="108" rx="34" ry="34" fill="url(#shieldBg)" filter="url(#badgeGlow)" />

  <!-- Top Right Glowing Live Notification Badge -->
  <circle cx="108" cy="18" r="16" fill="#00e599" />
  <circle cx="108" cy="18" r="11" fill="#4ade80" />
  <circle cx="108" cy="18" r="6" fill="#bbf7d0" />

  <!-- Shield Outline with Smooth Curves -->
  <path 
    d="M62 38 C75 38 85 41 85 41 C85 64 76 81 62 92 C48 81 39 64 39 41 C39 41 49 38 62 38 Z" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="7.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Crisp Centered Checkmark -->
  <path 
    d="M53 64 L60 71 L73 56" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="7.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
